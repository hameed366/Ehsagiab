<style>

<div class="hd"><img id="lg" alt="" hidden><div><h1 id="ttl">📋 إحصائية الغياب اليومي</h1><div class="mu" id="sub"></div></div></div>
<div class="tabs"><button id="t-entry" onclick="T='entry';R()">رصد الغياب</button><button id="t-rep" onclick="T='rep';R()">إحصائية اليوم</button><button id="t-man" onclick="T='man';R()" style="display:none">الإعدادات</button><button id="t-conn" onclick="T='conn';R()">الربط</button></div>

<script>
const GN={'السادس':6,'السابع':7,'الثامن':8,'التاسع':9},NUM=/^[\d٠-٩۰-۹.\s]+$/;
const DEFG=()=>({grades:[['g1','السادس',9],['g2','السابع',8],['g3','الثامن',8],['g4','التاسع',8]].map(a=>({id:a[0],name:a[1],count:a[2]})),locked:false});
let db=1,ready=false,isAdmin=false,canW=true,online=-1,sig='',CFG=null,STU={},ABS={},unsubA=null,T='entry',G=null,K=null,D=td(),pend='',msg='',IMP=null,IS='all',dirty=0,conf={},SEL=new Set(),SM=0,LK=null;

/* ===== طبقة التخزين: Google Sheets (عبر Apps Script) أو وضع محلي ===== */
const DEF_URL='',DEF_TOKEN='';/* يمكنك وضع رابط التطبيق والرمز هنا ليعمل الملف مباشرة لكل المعلمين */
const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},LSS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
let URL_=LS('abs_url')!==null?LS('abs_url'):DEF_URL,TOK=LS('abs_tok')!==null?LS('abs_tok'):DEF_TOKEN,ADM=LS('abs_adm')||'';
function loc(){try{return JSON.parse(LS('abs_local'))||{}}catch(e){return{}}}
async function api(body){const r=await fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:TOK,admin:ADM},body))});const j=await r.json();if(j&&j.error){const e=new Error(j.error);e.code=j.error;throw e}return j}
async function load(){if(URL_)return api({action:'load',date:D});const o=loc(),m={};Object.keys(o.absence||{}).forEach(x=>{if(x.startsWith(D+'|'))m[x.split('|')[1]]=o.absence[x]});return{config:o.config||null,students:o.students||{},absence:m}}
async function put(op){if(URL_)return api(op);const o=loc();if(op.action=='set'){if(op.key=='config')o.config=op.value;else{o.students=o.students||{};o.students[op.key.slice(9)]=op.value.list||[]}}else{o.absence=o.absence||{};o.absence[op.date+'|'+op.key]=op.ids}LSS('abs_local',JSON.stringify(o))}
async function pull(){const d=D;try{const j=await load();if(d!==D)return;let c=busy('cfg')?CFG:(j.config?cl(j.config):null);const m={};Object.keys(j.students||{}).forEach(k=>{m[k]=cl(j.students[k])});for(const k in STU)if(busy('s'+k))m[k]=STU[k];const a={};Object.keys(j.absence||{}).forEach(k=>{a[k]=(j.absence[k]||[]).slice()});for(const k in ABS)if(busy('a'+D+k))a[k]=ABS[k];
const ns=JSON.stringify([c,m,a]);const was=online;online=1;if(ns!==sig||was!==1){sig=ns;CFG=c;STU=m;ABS=a;dr()}}catch(e){if(online!==0){msg=e&&e.code=='auth'?'رمز الدخول غير صحيح':'تعذر الاتصال بـ Google Sheets، تحقق من الإنترنت ومن الرابط';online=0;dr()}}}
function saveFile(name,data){const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/i.test(name)?'text/html;charset=utf-8':'application/octet-stream'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
async function migrate(){if(!isAdmin)return;const j=await load();if(j.config||Object.keys(j.students||{}).length)return;const o=loc();if(!o.config&&!Object.keys(o.students||{}).length)return;if(o.config)await api({action:'set',key:'config',value:o.config});for(const k in o.students||{})await api({action:'set',key:'students_'+k,value:{list:o.students[k]}});msg+=' — تم نقل بيانات هذا الجهاز إلى الجدول'}
async function saveConn(){const u=nn(document.getElementById('cu').value),t=nn(document.getElementById('ct').value),a=document.getElementById('ca').value;URL_=u;TOK=t;ADM=a;LSS('abs_url',u);LSS('abs_tok',t);LSS('abs_adm',a);sig='';online=-1;msg='';
if(!u){isAdmin=true;msg='تم الرجوع للوضع المحلي';await pull();R();return}
try{await load();isAdmin=false;if(a){try{await api({action:'chk'});isAdmin=true}catch(e){msg='الاتصال ناجح لكن كلمة مرور المدير غير صحيحة. '}}
msg+='تم الاتصال بنجاح'+(isAdmin?' — صلاحية المدير مفعّلة':'');await migrate()}catch(e){msg=e&&e.code=='auth'?'رمز الدخول غير صحيح':'تعذر الاتصال بالرابط، تأكد من نشر التطبيق ومن صحة الرابط'}
await pull();R()}
function localMode(){URL_='';LSS('abs_url','');sig='';isAdmin=true;msg='تم الرجوع للوضع المحلي';pull().then(R)}
function vConn(){return `<div class="card"><b>الربط مع Google Sheets</b><div class="mu" style="margin:6px 0">${URL_?(online===1?'✅ متصل بالجدول — كل الأجهزة ترى نفس البيانات.':'⚠️ الرابط محفوظ لكن الاتصال غير ناجح حاليًا.'):'وضع محلي: البيانات محفوظة في هذا المتصفح فقط. أدخل رابط التطبيق لمشاركتها عبر Google Sheets.'}</div><div class="row"><input id="cu" dir="ltr" placeholder="رابط تطبيق الويب (Apps Script)" value="${esc(URL_)}"></div><div class="row"><input id="ct" dir="ltr" placeholder="رمز الدخول (TOKEN)" value="${esc(TOK)}"></div><div class="row"><input id="ca" dir="ltr" type="password" placeholder="كلمة مرور المدير (ADMIN) — لتعديل الإعدادات" value="${esc(ADM)}"></div><div class="bar"><button class="p" onclick="saveConn()">حفظ واختبار الاتصال</button>${URL_?'<button class="d" onclick="localMode()">الرجوع للوضع المحلي</button>':''}</div><div class="mu">المعلمون يحتاجون الرابط والرمز فقط لرصد الغياب. كلمة مرور المدير لمن يعدّل الصفوف والطلاب.</div></div>`}

/* ===== رموز QR للفصول ===== */
let QR=0,QI=1;
function BASE(){const b=LS('abs_base');if(b)return b;return /^https?:/.test(location.href)?location.href.replace(/#.*$/,''):''}
function qrUrl(k){let h='c='+k;if(QI){if(URL_)h+='&u='+encodeURIComponent(URL_);if(TOK)h+='&t='+encodeURIComponent(TOK)}return BASE().replace(/#.*$/,'')+'#'+h}
function qrSvg(t){const q=qrcode(0,'M');q.addData(t);q.make();const n=q.getModuleCount(),m=2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+='M'+(c+m)+','+(r+m)+'h1v1h-1z';const z=n+2*m;return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+z+' '+z+'" shape-rendering="crispEdges"><rect width="'+z+'" height="'+z+'" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>'}
function qrGrid(){if(!window.qrcode)return'<div class="msg">تعذر تحميل مكتبة QR، تأكد من الاتصال بالإنترنت</div>';let h='<div class="qg">';cfg().grades.forEach(g=>{for(let n=1;n<=g.count;n++)h+='<div class="qc">'+qrSvg(qrUrl(g.id+'_'+n))+'<b>'+esc(g.name)+' / '+n+'</b></div>'});return h+'</div>'}
function prQR(){const C=cfg();document.getElementById('pr').innerHTML='<style>.qg{display:grid;grid-template-columns:repeat(3,1fr);gap:8mm}.qc{border:1px solid #888;padding:6px;text-align:center;page-break-inside:avoid;color:#000;background:#fff}.qc svg{width:100%;height:auto}.qc b{display:block;font-size:16px}</style><h2 style="text-align:center">'+esc(C.school||'رموز QR لرصد الغياب')+'</h2>'+qrGrid();try{window.print()}catch(e){msg='تعذرت الطباعة';R()}}
function qrCard(){const b=BASE();let h='<div class="card"><b>رموز QR للفصول</b><div class="mu" style="margin:6px 0">كل رمز يفتح صفحة رصد فصله مباشرة. اطبعها وسلّم كل معلم رمز فصله.</div><div class="row"><input dir="ltr" placeholder="رابط الأداة بعد رفعها على الاستضافة" value="'+esc(b)+'" onchange="LSS(\'abs_base\',nn(this.value));R()"></div><label class="mu" style="display:block;margin:6px 0"><input type="checkbox" '+(QI?'checked':'')+' onchange="QI=this.checked?1:0;R()"> تضمين رابط Google Sheets والرمز داخل QR (يعمل من أول مسح دون إعداد)</label>'+(QI&&URL_?'<div class="mu" style="margin-bottom:6px">⚠️ من يمسح الرمز يستطيع رصد الغياب، فلا تعلّقه في مكان عام.</div>':'');
if(!/^https?:/.test(b))h+='<div class="msg">الـ QR لا يعمل مع ملف على الجهاز. ارفع الأداة على استضافة والصق رابطها أعلاه.</div>';
else{h+='<div class="bar"><button class="p" onclick="QR=!QR;R()">'+(QR?'إخفاء الرموز':'عرض الرموز')+'</button><button onclick="prQR()">🖨 طباعة كل الرموز</button></div>';if(QR)h+=qrGrid()}
return h+'</div>'}
function applyHash(){const h=location.hash.slice(1);if(!h)return false;const p=new URLSearchParams(h);let ch=false;
if(p.get('u')){URL_=p.get('u');LSS('abs_url',URL_);ch=true}
if(p.get('t')){TOK=p.get('t');LSS('abs_tok',TOK);ch=true}
const c=p.get('c');if(c&&/^[\w-]+_\d+$/.test(c)){K=c;G=c.split('_')[0];T='entry'}
if(ch||c){try{history.replaceState(null,'',location.pathname+location.search+(c?'#c='+c:''))}catch(e){}}
return ch}
const WQ={},cfg=()=>CFG||DEFG(),busy=i=>WQ[i]&&(WQ[i].b||WQ[i].d),uid=()=>Math.random().toString(36).slice(2,9),nn=s=>String(s).replace(/\s+/g,' ').trim(),cl=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function td(){return fmt(new Date())}
function dlabel(){try{return new Date(D+'T12:00:00').toLocaleDateString('ar-KW',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}catch(e){return D}}
function pc(a,b){return b?(a/b*100).toFixed(1)+'%':'—'}
function gcur(){const gs=cfg().grades;return gs.find(g=>g.id==G)||gs[0]||null}
function gnm(id){const g=cfg().grades.find(x=>x.id==id);return g?g.name:''}
function wr(id,ref,get){const q=WQ[id]=WQ[id]||{b:0,d:0};q.d=1;if(q.b)return;q.b=1;(async()=>{try{while(q.d){q.d=0;await ref.set(get())}}catch(e){q.d=0;msg=e&&e.code=='admin'?'تعذر الحفظ: لا تملك صلاحية المدير (راجع تبويب الربط)':e&&e.code=='auth'?'تعذر الحفظ: رمز الدخول غير صحيح':'تعذر الحفظ، تحقق من الاتصال'}q.b=0;R()})()}
function mut(f){if(!CFG)CFG=DEFG();f(CFG);wr('cfg',{set:v=>put({action:'set',key:'config',value:v})},()=>CFG);R()}
function sw(k){wr('s'+k,{set:v=>put({action:'set',key:'students_'+k,value:v})},()=>({list:STU[k]||[]}))}
function setAbs(k,a){if(canW===false)return;const d=D;ABS[k]=a;wr('a'+d+k,{set:v=>put(Object.assign({action:'abs'},v))},()=>{const p=k.split('_'),L=STU[k]||[],ids=ABS[k]||[],st=new Set(ids);return{date:d,key:k,ids,grade:gnm(p[0]),cls:+p[1],total:L.length,names:L.filter(x=>st.has(x.id)).map(x=>x.name)}});R()}
function tg(id){const a=(ABS[K]||[]).slice(),i=a.indexOf(id);i>=0?a.splice(i,1):a.push(id);setAbs(K,a)}
function setD(v){D=v||td();K=null;subAbs();R()}
function sh(n){const d=new Date(D+'T12:00:00');d.setDate(d.getDate()+n);setD(fmt(d))}
function dr(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA/.test(a.tagName)&&a.type!=='date'){dirty=1;return}R()}
addEventListener('focusout',()=>{if(dirty){dirty=0;setTimeout(R,400)}});
const er=e=>{msg='خطأ في الاتصال: '+(e&&e.code||'');R()};
function subAbs(){ABS={};pull()}
